<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iLab Kiosk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
<style>
:root{
  --bg:#f3f5f2; --card:#ffffff; --ink:#0e1d2b; --muted:#5d6b76; --line:#e1e6e2; --soft:#eef2ef;
  --accent:#0d7a6f; --accent-2:#0a5f57; --accent-soft:#e3f3f0;
  --amber:#d97706; --amber-soft:#fdf3e2; --red:#d1373a; --red-soft:#fdeaea; --green:#15803d; --green-soft:#e6f5ea;
  --blue:#2563eb; --blue-soft:#e8effd; --violet:#7c3aed; --violet-soft:#f0eafd;
  --r:14px; --shadow:0 1px 2px rgba(14,29,43,.06),0 4px 16px rgba(14,29,43,.05);
  --head:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em}
h1{font-size:clamp(26px,4vw,38px)} h2{font-size:22px} h3{font-size:16px}
.muted{color:var(--muted)} .sm{font-size:13px} .xs{font-size:12px} .red{color:var(--red)} .grow{flex:1}
.hidden{display:none!important}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#14b8a6,#0d7a6f);display:grid;place-items:center}
.logo svg{width:20px;height:20px}
.brand-name{font-family:var(--head);font-weight:700;font-size:17px;line-height:1.1}
.brand-sub{font-size:11px;opacity:.65;letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;border:0;color:#c9d4dc;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;font-weight:500;font-size:14px}
nav button svg{width:16px;height:16px;opacity:.8}
nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button.on{background:#fff;color:var(--ink)}
nav .lk{width:12px!important;height:12px!important;opacity:.5}
.top-r{display:flex;align-items:center;gap:10px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:#94a3b8;display:inline-block}
.dot.ok{background:#34d399}.dot.err{background:#f87171}
.top-r .btn{padding:5px 10px;font-size:12.5px;background:rgba(255,255,255,.12);color:#fff;border-color:transparent}
@media (max-width:760px){ nav{order:3;flex-basis:100%} }

#banner:empty{display:none}
.banner{padding:10px 18px;font-size:14px;display:flex;gap:10px;align-items:center}
.banner.err{background:var(--red-soft);color:#7f1d1d}.banner.warn{background:var(--amber-soft);color:#7c2d12}.banner.info{background:var(--blue-soft);color:#1e3a8a}

main{max-width:1240px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 120px}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gap{gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;padding:10px 16px;border-radius:11px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:hover{border-color:#c7d0cb;background:#fafbfa}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{background:#fff;border-color:#f3c4c5;color:var(--red)}
.btn.danger.solid{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.outline{border-style:dashed;border-color:#b9c6c0}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.sm svg{width:15px;height:15px}
.btn.lg{padding:14px 22px;font-size:16px;border-radius:13px}
.btn.block{width:100%}
.icon-btn{border:0;background:transparent;width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:16px;color:var(--muted)}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:600;color:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.badge.teacher{background:var(--violet-soft);color:var(--violet)}
.badge.student{background:var(--blue-soft);color:var(--blue)}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.warn{background:var(--amber-soft);color:var(--amber)}
.badge.bad{background:var(--red-soft);color:var(--red)}
.badge.grey{background:var(--soft);color:var(--muted)}
.badge.admin{background:var(--ink);color:#fff}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld.inline{flex-direction:row;align-items:center;margin:0}
input[type=text],input[type=password],input:not([type]),input[type=number],input[type=search],input[type=datetime-local],input[type=time],select,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;outline:none;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;margin-bottom:10px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}

/* kiosk */
.kiosk-home{text-align:center;padding:24px 0 10px}
.kiosk-home p{margin:8px 0 26px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:820px;margin:0 auto}
@media (max-width:620px){.choices{grid-template-columns:1fr}}
.choice{border:0;border-radius:22px;padding:34px 24px;cursor:pointer;color:#fff;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:200px;justify-content:flex-end;position:relative;overflow:hidden;transition:transform .15s, box-shadow .15s}
.choice:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(14,29,43,.18)}
.choice svg{width:46px;height:46px;position:absolute;top:24px;left:24px;opacity:.95}
.choice b{font-family:var(--head);font-size:30px}
.choice span{opacity:.85}
.choice.borrow{background:linear-gradient(140deg,#0d7a6f,#0b4f49)}
.choice.return{background:linear-gradient(140deg,#1f3b57,#0e1d2b)}
.home-strip{margin:26px auto 0;max-width:820px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.hint{margin-top:16px;font-size:13.5px;color:var(--muted)}
.setup{max-width:820px;margin:26px auto 0;text-align:left}
.setup ol{margin:8px 0 14px;padding-left:20px}
.setup li{margin:4px 0}

.stepper{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted)}
.step i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:12px}
.step.on{border-color:var(--accent);color:var(--ink)}
.step.on i{background:var(--accent);color:#fff}
.step.done i{background:var(--accent-soft);color:var(--accent)}

.scanbox{display:flex;flex-direction:column;gap:10px}
.scan-input{display:flex;align-items:center;gap:8px;border:2px solid var(--accent);border-radius:14px;padding:6px 6px 6px 12px;background:#fff}
.scan-input input{border:0!important;box-shadow:none!important;padding:10px 4px;font-size:17px}
.scan-ico{color:var(--accent);display:grid}
.scan-ico svg{width:24px;height:24px}
.scan-cams{display:flex;gap:8px;flex-wrap:wrap}
.scan-cams .btn{flex:1}
.cam{cursor:pointer}
.fb{min-height:24px;margin:12px 0;font-weight:600;font-size:14.5px;display:flex;gap:8px;align-items:flex-start}
.fb.ok{color:var(--green)} .fb.err{color:var(--red)} .fb.warn{color:var(--amber)} .fb.info{color:var(--muted)}
.fb.flash{animation:flash .5s}
@keyframes flash{0%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}100%{transform:translateX(0)}}

.id-card{max-width:560px;margin:0 auto}
.id-card h2{margin-bottom:6px}
.who{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow);flex-wrap:wrap}
.avatar{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:19px;flex:none}
.avatar.teacher{background:var(--violet-soft);color:var(--violet)}
.avatar.student{background:var(--blue-soft);color:var(--blue)}
.who-txt{flex:1;min-width:180px}
.who-name{font-family:var(--head);font-weight:700;font-size:21px}
.who-meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13.5px;flex-wrap:wrap}
.who-note{font-size:13px;margin-top:3px;color:var(--amber)}
.timer-box{display:flex;flex-direction:column;align-items:flex-end;font-size:12px}
.timer-box b{font-family:var(--head);font-size:20px}
.kgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px}
@media (max-width:860px){.kgrid{grid-template-columns:1fr}}
.kfoot{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px;z-index:15}
.kfoot-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px;width:100%}

.line{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .nm{font-weight:600}
.line .info{flex:1;min-width:0}
.line .sub{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.line.new{animation:pop .5s}
@keyframes pop{0%{background:var(--accent-soft)}100%{background:transparent}}
.thumb{width:38px;height:38px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--muted);flex:none}
.thumb svg{width:19px;height:19px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.qty button{border:0;background:#fff;width:32px;height:32px;cursor:pointer;font-size:17px;font-weight:600}
.qty button:hover{background:var(--soft)}
.qty b{min-width:30px;text-align:center;font-family:var(--head)}

.done-screen{text-align:center;max-width:620px;margin:20px auto}
.done-ico{width:96px;height:96px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:0 auto 18px;animation:pop2 .5s}
.done-ico svg{width:50px;height:50px}
@keyframes pop2{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.done-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:22px 0}
.done-meta div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.done-meta b{display:block;font-family:var(--head);font-size:20px}

.bcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.bcard.over{border-color:#f1b9ba;background:#fffafa}
.bcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.chip{background:var(--soft);border-radius:7px;padding:3px 8px;font-size:12.5px}
.bc-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rgroup{border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin-bottom:10px}
.rg-h{padding:10px 0 4px;font-size:13.5px}
.cond{width:auto!important;padding:6px 8px!important;font-size:13px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.kpi .v{font-family:var(--head);font-size:32px;font-weight:700;line-height:1.1}
.kpi .l{color:var(--muted);font-size:13px;font-weight:500}
.kpi.alert .v{color:var(--red)} .kpi.warn .v{color:var(--amber)}
.dash{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
@media (max-width:900px){.dash{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cat{border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.cat b{font-family:var(--head);font-size:19px}
.act{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.act:last-child{border:0}
.act .ai{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.act .ai svg{width:15px;height:15px}
.ai.o{background:var(--accent-soft);color:var(--accent)} .ai.r{background:var(--blue-soft);color:var(--blue)}

/* tables */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#fafcfb}
.tbl-wrap{overflow-x:auto}
@media (max-width:700px){
  .tbl.resp thead{display:none}
  .tbl.resp tr{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .tbl.resp td{border:0;padding:2px 0}
  .tbl.resp td.hide-m{display:none}
}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.lock{max-width:480px;margin:40px auto;text-align:center}
.lock-ico{width:64px;height:64px;border-radius:18px;background:var(--soft);display:grid;place-items:center;margin:0 auto 12px}
.lock-ico svg{width:30px;height:30px}
.lock .scanbox{text-align:left;margin-top:16px}
.rank{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.rank:last-child{border:0}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(14,29,43,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow-y:auto;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:18px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:860px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
.modal-b{padding:8px 18px 18px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#live-reader{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:240px}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,92vw);pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .2s;pointer-events:auto}
.toast.err{background:var(--red)} .toast.warn{background:#b45309} .toast.ok{background:#0f5132}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:70;display:grid;place-items:center;font-weight:600}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.progress{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
#qr-tmp{position:absolute;left:-9999px;top:0;width:400px;height:400px}

/* ---- Apps Script additions ---- */
.logo{overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.logo.has-img{background:#fff;width:44px;height:44px;border-radius:10px;padding:3px}
.school{font-size:11.5px;opacity:.7;letter-spacing:.04em}
.hero-logo{height:86px;max-width:260px;object-fit:contain;margin:0 auto 14px;display:block}
.login{max-width:440px;margin:6vh auto}
.login .fld input{font-size:17px}
.admin-top{background:#0b1622}
#print-area{display:none}
@media print{
  body.printing>*:not(#print-area){display:none!important}
  body.printing #print-area{display:block}
  @page{size:A4;margin:10mm}
}
#print-area .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm;font-family:Arial,sans-serif}
#print-area .lab{border:1px dashed #bbb;border-radius:2mm;padding:2.5mm;text-align:center;break-inside:avoid;height:32mm;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
#print-area .lab img{height:6mm;object-fit:contain;margin:0 auto}
#print-area .n{font-size:10pt;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1mm 0}
#print-area .l{font-size:7pt;color:#666}
#print-area svg{max-width:100%;height:16mm}
.offline{position:fixed;top:0;left:0;right:0;z-index:80}
</style>

</head>
<body>
<header class="top"><div class="brand" id="brand"></div><div class="grow"></div><div class="top-r" id="top-r"></div></header>
<div id="banner"></div>
<main id="app"><div class="empty"><div class="spin"></div>Loading…</div></main>
<div id="modal-root"></div>
<div id="toasts"></div>
<div id="qr-tmp"></div>
<script>
/* =====================================================================
   iLab camera kiosk. Paste your Apps Script web app URL (ends in /exec)
   below before uploading, or leave it blank and enter it on first open.
   ===================================================================== */
window.ILAB_CONFIG = {
  apiUrl: 'https://script.google.com/macros/s/AKfycbwMCtbDmtUe8TJMvVKLCRH8fUvV47ZV21AHfx8K6twlQKlCC--ACoy8Q9jeDsJpWHfL/exec',      // e.g. 'https://script.google.com/macros/s/AKfy.../exec'
  kioskKey: 'helloworld'     // only if you set a Kiosk key in Admin → Settings
};
window.BOOT = { page: 'kiosk', settings: {}, logo: '', webUrl: '' };
</script>
<script>
'use strict';
/* ---------- helpers ---------- */

'use strict';

const APP = () => $('#app');
let lastLoad = 0, loading = false;

async function load(silent) {
  if (loading) return; loading = true;
  try {
    const d = await call('kioskState');
    S.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {});
    S.items = new Map((d.items || []).map(i => [key(i.code), i]));
    S.open = normLoans(d.open);
    derive(); lastLoad = Date.now();
    $('#top-r').innerHTML = '<span class="dot ok" title="Connected"></span>';
    setBanner();
    if (!silent || S.k.mode === 'home') renderKiosk(); else update();
  } catch (e) {
    $('#top-r').innerHTML = '<span class="dot err" title="Offline"></span>';
    if (!silent) setBanner('err', esc('Could not load the inventory: ' + errMsg(e)));
  } finally { loading = false; }
}
function update() {
  const k = S.k;
  if (k.mode === 'home') { const s = $('#home-strip'); if (s) s.innerHTML = homeStrip(); }
  else if (k.mode === 'return') renderReturnLists();
}
// refresh every 30 s (not while someone is mid-checkout)
setInterval(() => { if (!S.busy && (S.k.mode === 'home' || S.k.mode === 'return' || S.k.mode === 'done')) load(true); }, 30000);
// reset after inactivity
setInterval(() => {
  const idle = (Date.now() - lastAct) / 1000;
  if (S.k.mode !== 'home' && S.k.mode !== 'done' && !S.busy && !$('.modal-bg') && idle > (+S.settings.idleSec || 120)) { resetKiosk(); toast('Session reset after inactivity.', 'warn'); }
}, 2000);

function resetKiosk() { clearTimeout(S.doneTimer); S.k = { mode: 'home' }; renderKiosk(); if (Date.now() - lastLoad > 10000) load(true); }
function homeStrip() {
  const outN = [...S.out.values()].reduce((a, arr) => a + arr.reduce((x, y) => x + y.o, 0), 0);
  const over = S.open.filter(isOverdue).length;
  return `<span class="pill">${ICON.out.replace('<svg', '<svg style="width:13px;height:13px"')} ${plural(outN, 'item')} out</span>${over ? `<span class="pill" style="background:var(--red-soft);color:var(--red)">${plural(over, 'overdue batch')}</span>` : ''}`;
}
function stepper(n) {
  const L = ['Scan ID card', 'Scan items', 'Confirm'];
  return `<div class="stepper">${L.map((l, i) => `<div class="step ${i + 1 === n ? 'on' : i + 1 < n ? 'done' : ''}"><i>${i + 1 < n ? '✓' : i + 1}</i>${l}</div>`).join('')}</div>`;
}
function renderKiosk() {
  const el = APP(), k = S.k; S.scanHandler = null;
  if (k.mode === 'home') {
    el.innerHTML = `<div class="kiosk-home">${BOOT.logo ? `<img class="hero-logo" src="${esc(BOOT.logo)}" alt="">` : ''}<h1>Welcome to the ${esc(S.settings.labName || 'iLab')}</h1><p class="muted">What would you like to do?</p>
      <div class="choices">
        <button class="choice borrow" data-act="k-borrow">${ICON.out}<b>Borrow</b><span>Scan your ID card, then scan the items</span></button>
        <button class="choice return" data-act="k-return">${ICON.ret}<b>Return</b><span>Scan items, or pick the batch you took</span></button>
      </div>
      <div class="home-strip" id="home-strip">${homeStrip()}</div>
      <div class="hint">Shortcut: scan your ID card to start borrowing, or scan an item to return it.</div>
      <div style="max-width:420px;margin:16px auto 0" id="home-scan">${scanBoxHTML('Scan ID card or item')}</div>
      ${S.items.size ? '' : '<div class="card setup"><h3>No items yet</h3><p class="muted sm">A lab admin needs to add people and items on the admin page first.</p></div>'}</div>`;
    wireScan($('#home-scan'), homeScan);
  } else if (k.mode === 'borrow' && k.step === 'id') {
    el.innerHTML = `${stepper(1)}<div class="card id-card"><h2>Scan your ID card</h2><p class="muted">Use the barcode scanner, the camera, or type your ID number.</p>${scanBoxHTML('ID card number')}<div id="id-msg" class="fb"></div><div class="row"><button class="btn ghost" data-act="k-cancel">← Back</button></div></div>`;
    wireScan(el, idScan);
  } else if (k.mode === 'borrow' && k.step === 'items') {
    el.innerHTML = borrowItemsHTML(); wireScan($('#item-scan'), addCartScan, { continuous: true }); renderCart();
  } else if (k.mode === 'borrow' && k.step === 'review') {
    el.innerHTML = borrowReviewHTML(); wireReview();
    S.scanHandler = code => { k.step = 'items'; renderKiosk(); addCartScan(code); };
  } else if (k.mode === 'return') {
    el.innerHTML = returnHTML(); wireScan($('#ret-scan'), returnScan, { continuous: true }); renderReturnLists();
    const q = $('#ret-q'); q.oninput = () => { k.q = q.value; renderReturnLists(); };
  } else if (k.mode === 'done') {
    el.innerHTML = k.html; S.scanHandler = homeScan;
    clearTimeout(S.doneTimer); S.doneTimer = setTimeout(() => { if (S.k === k) resetKiosk(); }, 15000);
  }
}
async function lookup(code) {
  try { return await call('lookupPerson', code); } catch (e) { toast('Could not check that ID: ' + errMsg(e), 'err'); return undefined; }
}
async function homeScan(code) {
  const it = S.items.get(key(code));
  if (it) {
    if (outQty(key(it.code)) > 0) { startReturn(); returnScan(code); return; }
    beep(false); toast(`${it.name} isn’t checked out. To borrow it, scan your ID card first.`, 'warn', 5000); return;
  }
  const p = await lookup(code);
  if (p === undefined) return;
  if (p) startBorrow(p);
  else { beep(false); toast(`“${code}” isn’t a registered ID card or item.`, 'err', 5000); }
}
ACT['k-borrow'] = () => { S.k = { mode: 'borrow', step: 'id' }; renderKiosk(); };
ACT['k-return'] = () => startReturn();
ACT['k-cancel'] = async () => {
  if (S.k.mode === 'borrow' && S.k.cart?.length && !(await ask('Cancel this checkout? The scanned items will be cleared.', 'Yes, cancel', true))) return;
  resetKiosk();
};
ACT['k-done'] = () => resetKiosk();
function eligibility(p) {
  if (p.active === false) return `${p.name}’s ID is deactivated. Please see the lab admin.`;
  const over = personLoans(p.id).filter(isOverdue);
  if (p.role !== 'teacher' && S.settings.blockOverdue && over.length) return `${firstName(p.name)}, you have overdue items (${over.map(b => b.label).join(', ')}). Please return them before borrowing more.`;
  return null;
}
function startBorrow(p) {
  const err = eligibility(p);
  if (err) { beep(false); const m = $('#id-msg'); if (m) { m.className = 'fb err flash'; m.textContent = err; } else toast(err, 'err', 6000); return; }
  beep();
  S.k = { mode: 'borrow', step: 'items', person: p, startAt: Date.now(), cart: [] };
  renderKiosk();
}
async function idScan(code) {
  const m = $('#id-msg');
  if (S.items.get(key(code))) { beep(false); m.className = 'fb err flash'; m.textContent = 'That’s an item barcode — please scan your ID card first.'; return; }
  m.className = 'fb info'; m.textContent = 'Checking…';
  const p = await lookup(code);
  if (p === undefined) { m.textContent = ''; return; }
  if (!p) { beep(false); m.className = 'fb err flash'; m.textContent = `ID “${code}” isn’t registered. Ask the lab admin to add you.`; return; }
  startBorrow(p);
}
function borrowItemsHTML() {
  const k = S.k, p = k.person, loans = personLoans(p.id);
  const outN = loans.reduce((a, b) => a + outstandingOf(b), 0);
  return `${stepper(2)}
  <div class="who"><div class="avatar ${p.role === 'teacher' ? 'teacher' : 'student'}">${esc(initials(p.name))}</div>
    <div class="who-txt"><div class="who-name">${esc(p.name)}</div>
      <div class="who-meta"><span class="badge ${p.role === 'teacher' ? 'teacher' : 'student'}">${p.role === 'teacher' ? 'Teacher' : 'Student'}</span>${p.group ? `<span>${esc(p.group)}</span>·` : ''}<span>ID ${esc(p.id)}</span></div>
      ${outN ? `<div class="who-note">Already has ${plural(outN, 'item')} out${loans.some(isOverdue) ? ' — <b class="red">some are overdue</b>' : ''}</div>` : ''}</div>
    <div class="timer-box"><span class="muted">Session time</span><b data-timer-from="${k.startAt}">0s</b></div>
    <button class="btn ghost sm" data-act="k-cancel">Not you? Cancel</button></div>
  <div class="kgrid">
    <section class="card"><h3 style="margin-bottom:10px">Scan items</h3><div id="item-scan">${scanBoxHTML('Scan or type an item barcode')}</div>
      <div id="fb" class="fb info">Scan each item. Scan a counted item again to add one more.</div>
      <button class="btn block outline" data-act="loose">${ICON.box} Add loose items (no barcode)</button></section>
    <section class="card"><div class="card-h"><h3>Items to borrow</h3><span class="pill" id="cart-count">0</span></div><div id="cart"></div></section>
  </div>
  <div class="kfoot"><div class="kfoot-in"><button class="btn ghost" data-act="k-cancel">Cancel</button><div class="grow"></div><span id="cart-sum" class="muted sm"></span><button class="btn primary lg" data-act="b-review" id="b-review">Next: Review →</button></div></div>`;
}
function fb(type, msg) { const f = $('#fb'); if (f) { f.className = 'fb ' + type + (type === 'err' ? ' flash' : ''); f.innerHTML = msg; } beep(type !== 'err'); }
const cartCountable = cart => cart.filter(l => l.kind !== 'consumable').reduce((a, l) => a + l.qty, 0);
function addCartScan(code) {
  const k = S.k, p = k.person; if (!p) return;
  const kc = key(code);
  if (kc === key(p.id)) return fb('info', 'That’s your ID card — now scan the items.');
  const it = S.items.get(kc);
  if (!it) return fb('err', `Unknown barcode “${esc(code)}”. If it’s an item, ask the lab admin to register it. If it’s another ID card, finish or cancel this checkout first.`);
  addCartItem(it, 1);
}
function addCartItem(it, n = 1) {
  const k = S.k, p = k.person, cart = k.cart;
  if (st(it) !== 'active') return fb('err', `${esc(it.name)} is ${STATUS_LABEL[st(it)].toLowerCase()} and can’t be borrowed.`);
  if (it.teacherOnly && p.role !== 'teacher') return fb('err', `${esc(it.name)} is teacher-only.`);
  const kc = key(it.code);
  let line = cart.find(l => key(l.code) === kc), note = '';
  if (it.kind === 'asset' || !it.kind) {
    if (line) return fb('warn', `${esc(it.name)} is already in the list.`);
    const outs = S.out.get(kc);
    line = { code: it.code, name: it.name, category: it.category || '', kind: 'asset', qty: 1, prevOut: !!outs };
    if (outs) note = ` <span class="muted">— it was still logged to ${esc(outs[0].b.userName)}; that loan will be closed automatically.</span>`;
  } else {
    const av = avail(it), have = line ? line.qty : 0;
    if (have + n > av) return fb('err', `Only ${av} × ${esc(it.name)} available${have ? ` (${have} already in your list)` : ''}.`);
    if (!line) line = { code: it.code, name: it.name, category: it.category || '', kind: it.kind, qty: 0 };
  }
  const lim = +S.settings.studentMax || 0;
  if (p.role !== 'teacher' && lim > 0 && line.kind !== 'consumable') {
    const already = personLoans(p.id).reduce((a, b) => a + outstandingOf(b), 0);
    if (cartCountable(cart) + (line.kind === 'asset' ? 1 : n) + already > lim) return fb('err', `Students can borrow up to ${lim} items at a time${already ? ` (you already have ${already} out)` : ''}.`);
  }
  if (line.kind !== 'asset') line.qty += n;
  if (!cart.includes(line)) cart.unshift(line);
  k.lastCode = kc;
  fb(note ? 'warn' : 'ok', `${ICON.check.replace('<svg', '<svg style="width:18px;height:18px;flex:none"')}<span>Added ${esc(it.name)}${line.kind !== 'asset' ? ` (×${line.qty})` : ''}${note}</span>`);
  renderCart();
}
function renderCart() {
  const k = S.k, el = $('#cart'); if (!el) return;
  const cart = k.cart || [];
  el.innerHTML = cart.length ? cart.map((l, i) => `<div class="line ${key(l.code) === k.lastCode ? 'new' : ''}">
      <div class="thumb">${l.kind === 'asset' ? ICON.device : ICON.box}</div>
      <div class="info"><div class="nm">${esc(l.name)}</div><div class="sub"><span class="mono">${esc(l.code)}</span>${l.category ? `· ${esc(l.category)}` : ''}${l.kind === 'consumable' ? '<span class="badge grey">consumable</span>' : ''}${l.prevOut ? '<span class="badge warn">was logged out</span>' : ''}</div></div>
      ${l.kind !== 'asset' ? `<div class="qty"><button data-act="cq" data-i="${i}" data-d="-1">−</button><b>${l.qty}</b><button data-act="cq" data-i="${i}" data-d="1">+</button></div>` : ''}
      <button class="icon-btn" data-act="crm" data-i="${i}" aria-label="Remove">✕</button></div>`).join('')
    : `<div class="empty">${ICON.scan.replace('<svg', '<svg style="width:40px;height:40px;opacity:.4"')}<br>No items yet — scan the first one.</div>`;
  k.lastCode = null;
  const total = cart.reduce((a, l) => a + l.qty, 0);
  $('#cart-count').textContent = plural(total, 'item');
  $('#cart-sum').textContent = cart.length ? `${plural(total, 'item')} · ${plural(cart.length, 'line')}` : '';
  $('#b-review').disabled = !cart.length;
}
ACT.cq = t => {
  const k = S.k, l = k.cart[+t.dataset.i]; if (!l) return;
  if (+t.dataset.d > 0) { const it = S.items.get(key(l.code)); if (it) addCartItem(it, 1); return; }
  l.qty--; if (l.qty <= 0) k.cart.splice(+t.dataset.i, 1); renderCart();
};
ACT.crm = t => { S.k.cart.splice(+t.dataset.i, 1); renderCart(); };
ACT.loose = () => {
  const k = S.k; if (!k.person) return;
  const list = [...S.items.values()].filter(it => (it.kind !== 'asset' || it.noLabel) && st(it) === 'active' && !(it.teacherOnly && k.person.role !== 'teacher'))
    .sort((a, b) => (a.category || '').localeCompare(b.category || '') || a.name.localeCompare(b.name));
  const want = {};
  const m = modal(`<input type="search" id="lp-q" placeholder="Search loose items…" style="margin-bottom:10px"><div id="lp-list" style="max-height:55vh;overflow:auto"></div>
    <div class="modal-f"><button class="btn ghost" data-x>Cancel</button><button class="btn primary" id="lp-add">Add to list</button></div>`, { title: 'Loose items (no barcode)', wide: true });
  const draw = () => {
    const q = $('#lp-q', m.el).value.toLowerCase();
    const rows = list.filter(it => !q || (it.name + ' ' + (it.category || '') + ' ' + (it.location || '')).toLowerCase().includes(q));
    $('#lp-list', m.el).innerHTML = rows.length ? rows.map(it => {
      const inCart = (k.cart.find(l => key(l.code) === key(it.code)) || {}).qty || 0;
      const av = it.kind === 'asset' ? (avail(it) && !inCart ? 1 : 0) : avail(it) - inCart;
      const w = want[key(it.code)] || 0;
      return `<div class="line"><div class="thumb">${ICON.box}</div><div class="info"><div class="nm">${esc(it.name)}</div><div class="sub">${esc(it.category || '')}${it.location ? ' · ' + esc(it.location) : ''} · <b>${av}</b> available${it.kind === 'consumable' ? ' · consumable' : ''}</div></div>
        <div class="qty"><button data-lp="${esc(key(it.code))}" data-d="-1">−</button><b>${w}</b><button data-lp="${esc(key(it.code))}" data-d="1" ${w >= av ? 'disabled' : ''}>+</button></div></div>`;
    }).join('') : '<div class="empty">No loose items found.</div>';
  };
  $('#lp-q', m.el).oninput = draw;
  m.el.addEventListener('click', e => { const b = e.target.closest('[data-lp]'); if (!b) return; const kc = b.dataset.lp; want[kc] = Math.max(0, (want[kc] || 0) + +b.dataset.d); draw(); });
  $('#lp-add', m.el).onclick = () => { m.close(); for (const [kc, n] of Object.entries(want)) { if (n > 0) { const it = S.items.get(kc); if (it) addCartItem(it, it.kind === 'asset' ? 1 : n); } } };
  draw();
};
ACT['b-review'] = () => { if (!S.k.cart?.length) return; S.k.step = 'review'; renderKiosk(); };
ACT['b-back'] = () => { S.k.step = 'items'; renderKiosk(); };
function borrowReviewHTML() {
  const k = S.k, p = k.person, now = Date.now();
  const total = k.cart.reduce((a, l) => a + l.qty, 0);
  const defDue = k.due || (p.role === 'teacher' ? S.settings.teacherDue : S.settings.studentDue) || 'eod';
  return `${stepper(3)}<div class="kgrid">
    <section class="card"><h3 style="margin-bottom:12px">Checkout details</h3>
      <label class="fld"><span>Batch name (used to return everything together)</span><input id="r-label" value="${esc(k.label || `${firstName(p.name)} · ${fmtD(now)} ${fmtT(now)}`)}"></label>
      <label class="fld"><span>Purpose / class (optional)</span><input id="r-purpose" value="${esc(k.purpose || '')}" placeholder="e.g. Grade 8 Robotics, FLL practice"></label>
      <label class="fld"><span>Due back</span><select id="r-due">${DUE_OPTS.map(([v, l]) => `<option value="${v}" ${v === defDue ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="fld ${defDue === 'custom' ? '' : 'hidden'}" id="r-cw"><span>Custom due date</span><input type="datetime-local" id="r-custom"></label>
      <div class="muted sm" id="r-due-txt"></div></section>
    <section class="card"><div class="card-h"><h3>${esc(p.name)} <span class="badge ${p.role === 'teacher' ? 'teacher' : 'student'}">${p.role === 'teacher' ? 'Teacher' : 'Student'}</span></h3><span class="pill">${plural(total, 'item')}</span></div>
      <div class="muted sm" style="margin-bottom:6px">Scanning took <b data-timer-from="${k.startAt}"></b></div>
      ${k.cart.map(l => `<div class="line"><div class="thumb">${l.kind === 'asset' ? ICON.device : ICON.box}</div><div class="info"><div class="nm">${esc(l.name)}${l.qty > 1 ? ` × ${l.qty}` : ''}</div><div class="sub mono">${esc(l.code)}</div></div></div>`).join('')}
    </section></div>
  <div class="kfoot"><div class="kfoot-in"><button class="btn ghost" data-act="b-back">← Back to scanning</button><div class="grow"></div><button class="btn primary lg" data-act="b-confirm" id="b-confirm">${ICON.check} Confirm checkout</button></div></div>`;
}
function wireReview() {
  const sel = $('#r-due'), cw = $('#r-cw'), txt = $('#r-due-txt');
  const upd = () => { cw.classList.toggle('hidden', sel.value !== 'custom'); const d = dueFrom(sel.value, $('#r-custom').value); txt.textContent = d ? 'Due: ' + fmtDT(d) : sel.value === 'none' ? 'No due date' : ''; };
  sel.onchange = () => { S.k.due = sel.value; upd(); }; $('#r-custom').onchange = upd; upd();
  $('#r-label').oninput = e => S.k.label = e.target.value;
  $('#r-purpose').oninput = e => S.k.purpose = e.target.value;
}
ACT['b-confirm'] = async btn => {
  const k = S.k, p = k.person, now = Date.now();
  const preset = $('#r-due').value, dueAt = dueFrom(preset, $('#r-custom').value);
  if (preset === 'custom' && !dueAt) return toast('Pick a due date, or choose another option.', 'warn');
  btn.disabled = true; S.busy = true; showBusy('Saving checkout…');
  let r;
  try {
    r = await call('checkout', {
      personId: p.id, lines: k.cart.map(l => ({ code: l.code, qty: l.qty })), label: ($('#r-label').value || '').trim(),
      purpose: ($('#r-purpose').value || '').trim(), dueAt: dueAt || null, scanSeconds: Math.round((now - k.startAt) / 1000), device: deviceName(),
    });
  } catch (e) { hideBusy(); S.busy = false; btn.disabled = false; beep(false); toast(errMsg(e), 'err', 7000); load(true); return; }
  hideBusy(); S.busy = false; beep();
  S.k = { mode: 'done', html: `<div class="done-screen"><div class="done-ico">${ICON.check}</div><h1>You’re all set, ${esc(firstName(p.name))}!</h1>
    <p class="muted">${plural(r.totalQty, 'item')} checked out as <b>${esc(r.label)}</b></p>
    <div class="done-meta"><div><span class="muted sm">Items</span><b>${r.totalQty}</b></div><div><span class="muted sm">Scan time</span><b>${dur(r.scanSeconds)}</b></div><div><span class="muted sm">Due back</span><b style="font-size:15px">${esc(r.dueAt ? fmtDT(r.dueAt) : 'No due date')}</b></div></div>
    <button class="btn primary lg" data-act="k-done">Done</button><p class="muted sm">This screen resets automatically.</p></div>` };
  renderKiosk(); load(true);

/* ---------- return ---------- */
function startReturn() { S.k = { mode: 'return', startAt: Date.now(), person: null, sel: {}, q: '', exp: null }; renderKiosk(); }
function returnHTML() {
  return `<div class="page-head"><div><h2>Return items</h2><p class="muted" style="margin:4px 0 0">Scan each item, or pick a batch to return everything in it at once.</p></div><button class="btn ghost" data-act="k-cancel">✕ Cancel</button></div>
  <div class="kgrid">
    <section class="stack">
      <div class="card"><div id="ret-scan">${scanBoxHTML('Scan item (or scan an ID card to find their batches)')}</div><div id="fb" class="fb info"></div></div>
      <div class="card"><div class="card-h"><h3>Checked-out batches</h3><span id="ret-person"></span></div>
        <input type="search" id="ret-q" placeholder="Search name, batch or item…" style="margin-bottom:10px"><div id="ret-batches"></div></div>
    </section>
    <section class="card" style="align-self:start"><div class="card-h"><h3>Returning now</h3><span class="pill" id="ret-count">0</span></div><div id="ret-cart"></div>
      <label class="fld" style="margin-top:12px"><span>Note (optional)</span><input id="ret-note" placeholder="e.g. charger missing, screen cracked"></label></section>
  </div>
  <div class="kfoot"><div class="kfoot-in"><button class="btn ghost" data-act="k-cancel">Cancel</button><div class="grow"></div><span class="muted sm" id="ret-sum"></span><button class="btn primary lg" data-act="r-confirm" id="r-confirm">${ICON.check} Confirm return</button></div></div>`;
}
const selQty = (bid, kc) => S.k.sel[bid]?.[kc]?.qty || 0;
function selAdd(b, l, n) {
  const k = S.k, kc = docKey(l.code);
  const o = l.qty - (l.ret || 0), cur = selQty(b._id, kc);
  const add = Math.min(n, o - cur); if (add <= 0) return 0;
  k.sel[b._id] = k.sel[b._id] || {};
  k.sel[b._id][kc] = { code: l.code, name: l.name, kind: l.kind, qty: cur + add, cond: k.sel[b._id][kc]?.cond || 'ok' };
  return add;
}
const docKey = c => key(c).replace(/[^A-Z0-9_-]/g, '_');
function fbR(type, msg) { const f = $('#fb'); if (f) { f.className = 'fb ' + type + (type === 'err' ? ' flash' : ''); f.innerHTML = msg; } beep(type === 'ok' || type === 'info'); }
async function returnScan(code) {
  const k = S.k, kc = key(code);
  const it = S.items.get(kc), outs = S.out.get(kc);
  if (!it) {
    const p = await lookup(code);
    if (p === undefined) return;
    if (p) { k.person = p; fbR('info', `Showing batches for ${esc(p.name)}.`); renderReturnLists(); return; }
    return fbR('err', `Unknown barcode “${esc(code)}”.`);
  }
  if (!outs) return fbR('warn', `${esc(it.name)} isn’t logged as checked out — nothing to return.`);
  const sorted = [...outs].sort((a, b) => {
    const s = x => (k.person && key(x.b.userId) === key(k.person.id) ? 0 : 2) + (k.sel[x.b._id] ? 0 : 1);
    return s(a) - s(b) || a.b.startedAt - b.b.startedAt;
  });
  for (const x of sorted) {
    if (selAdd(x.b, x.l, 1)) {
      fbR('ok', `${ICON.check.replace('<svg', '<svg style="width:18px;height:18px;flex:none"')}<span>${esc(x.l.name)} — from <b>${esc(x.b.userName)}</b> (${esc(x.b.label)})</span>`);
      k.last = docKey(x.l.code); renderReturnLists(); return;
    }
  }
  fbR('warn', `All checked-out ${esc(it.name)} are already in the return list.`);
}
function renderReturnLists() {
  const k = S.k; if (k.mode !== 'return' || !$('#ret-batches')) return;
  for (const bid of Object.keys(k.sel)) if (!S.open.find(b => b._id === bid)) delete k.sel[bid];
  $('#ret-person').innerHTML = k.person ? `<span class="pill">${esc(k.person.name)} <button class="icon-btn" style="width:20px;height:20px;font-size:12px" data-act="r-clearp">✕</button></span>` : '';
  const q = (k.q || '').toLowerCase();
  let list = S.open.filter(b => outstandingOf(b) > 0);
  if (k.person) list = list.filter(b => key(b.userId) === key(k.person.id));
  if (q) list = list.filter(b => (b.label + ' ' + b.userName + ' ' + (b.group || '') + ' ' + (b.purpose || '') + ' ' + b.lines.map(l => l.name + ' ' + l.code).join(' ')).toLowerCase().includes(q));
  list.sort((a, b) => (isOverdue(b) - isOverdue(a)) || b.startedAt - a.startedAt);
  $('#ret-batches').innerHTML = list.length ? list.slice(0, 60).map(b => {
    const o = outstandingOf(b), sel = Object.values(k.sel[b._id] || {}).reduce((a, x) => a + x.qty, 0);
    const outLines = b.lines.filter(l => l.kind !== 'consumable' && l.qty - (l.ret || 0) > 0);
    return `<div class="bcard ${isOverdue(b) ? 'over' : ''} ${sel ? 'sel' : ''}">
      <div class="bc-top"><div><b>${esc(b.label)}</b><div class="muted sm">${esc(b.userName)} · ${b.role === 'teacher' ? 'Teacher' : 'Student'}${b.group ? ' · ' + esc(b.group) : ''} · out ${ago(b.confirmedAt || b.startedAt)}</div></div>${dueBadge(b)}</div>
      ${k.exp === b._id ? `<div style="margin:6px 0">${outLines.map(l => { const left = l.qty - (l.ret || 0) - selQty(b._id, docKey(l.code)); return `<div class="line"><div class="info"><div class="nm">${esc(l.name)}${l.qty - (l.ret || 0) > 1 ? ` × ${l.qty - (l.ret || 0)}` : ''}</div><div class="sub mono">${esc(l.code)}</div></div><button class="btn sm" data-act="r-line" data-b="${esc(b._id)}" data-c="${esc(l.code)}" ${left <= 0 ? 'disabled' : ''}>${left <= 0 ? 'Added' : '+ Add'}</button></div>`; }).join('')}</div>`
        : `<div class="chips">${outLines.slice(0, 6).map(l => `<span class="chip">${esc(l.name)}${l.qty - (l.ret || 0) > 1 ? ' ×' + (l.qty - (l.ret || 0)) : ''}</span>`).join('')}${outLines.length > 6 ? `<span class="chip">+${outLines.length - 6} more</span>` : ''}</div>`}
      <div class="bc-act"><span class="muted sm grow">${sel ? `<b style="color:var(--accent)">${sel}</b> of ` : ''}${plural(o, 'item')} outstanding</span>
        <button class="btn sm ghost" data-act="r-exp" data-b="${esc(b._id)}">${k.exp === b._id ? 'Hide items' : 'Choose items'}</button>
        <button class="btn sm primary" data-act="r-all" data-b="${esc(b._id)}" ${sel >= o ? 'disabled' : ''}>Return all ${o}</button></div></div>`;
  }).join('') : `<div class="empty">${k.person ? `${esc(k.person.name)} has nothing checked out.` : q ? 'No matching batches.' : 'Nothing is checked out right now.'}</div>`;
  let n = 0;
  const groups = Object.entries(k.sel).map(([bid, lines]) => {
    const b = S.open.find(x => x._id === bid); if (!b) return '';
    const rows = Object.entries(lines).map(([kc, v]) => {
      n += v.qty;
      const max = b.lines.filter(l => docKey(l.code) === kc && l.kind !== 'consumable').reduce((a, l) => a + l.qty - (l.ret || 0), 0);
      return `<div class="line ${k.last === kc ? 'new' : ''}"><div class="info"><div class="nm">${esc(v.name)}</div><div class="sub mono">${esc(v.code)}</div></div>
        ${max > 1 ? `<div class="qty"><button data-act="rq" data-b="${esc(bid)}" data-k="${kc}" data-d="-1">−</button><b>${v.qty}</b><button data-act="rq" data-b="${esc(bid)}" data-k="${kc}" data-d="1" ${v.qty >= max ? 'disabled' : ''}>+</button></div>` : ''}
        <select class="cond" data-chg="rcond" data-b="${esc(bid)}" data-k="${kc}"><option value="ok" ${v.cond === 'ok' ? 'selected' : ''}>Good</option><option value="damaged" ${v.cond === 'damaged' ? 'selected' : ''}>Damaged</option></select>
        <button class="icon-btn" data-act="rrm" data-b="${esc(bid)}" data-k="${kc}" aria-label="Remove">✕</button></div>`;
    }).join('');
    return `<div class="rgroup"><div class="rg-h"><b>${esc(b.label)}</b> <span class="muted">· ${esc(b.userName)}</span></div>${rows}</div>`;
  }).join('');
  k.last = null;
  $('#ret-cart').innerHTML = groups || `<div class="empty">${ICON.ret.replace('<svg', '<svg style="width:40px;height:40px;opacity:.4"')}<br>Scan items or choose a batch.</div>`;
  $('#ret-count').textContent = plural(n, 'item');
  $('#ret-sum').textContent = n ? `Returning ${plural(n, 'item')}` : '';
  $('#r-confirm').disabled = !n;
}
ACT['r-clearp'] = () => { S.k.person = null; renderReturnLists(); };
ACT['r-exp'] = t => { S.k.exp = S.k.exp === t.dataset.b ? null : t.dataset.b; renderReturnLists(); };
ACT['r-all'] = t => {
  const b = S.open.find(x => x._id === t.dataset.b); if (!b) return;
  let n = 0; for (const l of b.lines) if (l.kind !== 'consumable') n += selAdd(b, l, l.qty);
  if (n) fbR('ok', `Added ${plural(n, 'item')} from ${esc(b.label)}.`); renderReturnLists();
};
ACT['r-line'] = t => {
  const b = S.open.find(x => x._id === t.dataset.b); if (!b) return;
  const l = b.lines.find(x => x.code === t.dataset.c && x.kind !== 'consumable' && x.qty - (x.ret || 0) - selQty(b._id, docKey(x.code)) > 0);
  if (l && selAdd(b, l, l.kind === 'asset' ? 1 : l.qty - (l.ret || 0))) { S.k.last = docKey(l.code); beep(); }
  renderReturnLists();
};
ACT.rq = t => {
  const v = S.k.sel[t.dataset.b]?.[t.dataset.k]; if (!v) return;
  const b = S.open.find(x => x._id === t.dataset.b);
  const max = b ? b.lines.filter(l => docKey(l.code) === t.dataset.k && l.kind !== 'consumable').reduce((a, l) => a + l.qty - (l.ret || 0), 0) : v.qty;
  v.qty = Math.min(max, v.qty + +t.dataset.d);
  if (v.qty <= 0) delete S.k.sel[t.dataset.b][t.dataset.k];
  if (!Object.keys(S.k.sel[t.dataset.b]).length) delete S.k.sel[t.dataset.b];
  renderReturnLists();
};
ACT.rrm = t => { delete S.k.sel[t.dataset.b]?.[t.dataset.k]; if (S.k.sel[t.dataset.b] && !Object.keys(S.k.sel[t.dataset.b]).length) delete S.k.sel[t.dataset.b]; renderReturnLists(); };
CHG.rcond = t => { const v = S.k.sel[t.dataset.b]?.[t.dataset.k]; if (v) v.cond = t.value; };
ACT['r-confirm'] = async btn => {
  const k = S.k;
  const returns = [];
  for (const [bid, lines] of Object.entries(k.sel)) for (const v of Object.values(lines)) if (v.qty > 0) returns.push({ loanId: bid, code: v.code, qty: v.qty, cond: v.cond });
  if (!returns.length) return;
  btn.disabled = true; S.busy = true; showBusy('Saving return…');
  let r;
  try {
    r = await call('returnItems', { returns, byName: k.person ? k.person.name : 'Lab desk' + (deviceName() ? ` (${deviceName()})` : ''), note: ($('#ret-note')?.value || '').trim() });
  } catch (e) { hideBusy(); S.busy = false; btn.disabled = false; beep(false); toast(errMsg(e), 'err', 7000); load(true); return; }
  hideBusy(); S.busy = false; beep();
  const at = Date.now();
  S.k = { mode: 'done', html: `<div class="done-screen"><div class="done-ico" style="background:var(--blue-soft);color:var(--blue)">${ICON.check}</div><h1>${plural(r.total, 'item')} returned</h1><p class="muted">Thank you!</p>
    <div style="text-align:left;margin:18px 0">${r.loans.map(x => `<div class="bcard"><div class="bc-top"><div><b>${esc(x.label)}</b><div class="muted sm">${esc(x.userName)} · borrowed for ${durShort((at - (x.confirmedAt || at)) / 1000).replace('just now', 'under a minute')}</div></div>${x.left ? `<span class="badge warn">${x.left} still out</span>` : '<span class="badge ok">Fully returned</span>'}</div></div>`).join('')}</div>
    <button class="btn primary lg" data-act="k-done">Done</button></div>` };
  renderKiosk(); load(true);
};

/* ---------- boot (camera kiosk) ---------- */
function getCfg() {
  const c = window.ILAB_CONFIG || {};
  let ls = {};
  try { ls = JSON.parse(localStorage.getItem('ilab-cfg') || '{}'); } catch { }
  return { api: (c.apiUrl || ls.api || '').trim(), key: (c.kioskKey || ls.key || '').trim(), fixed: !!c.apiUrl };
}
function showSetup(cfg, msg) {
  $('#brand').innerHTML = brandHTML();
  APP().innerHTML = `<form class="card login" id="cf"><div class="lock-ico">${ICON.cog}</div><h2 style="text-align:center">Connect this kiosk</h2>
    <p class="muted sm" style="text-align:center">One-time setup for this device. Ask the lab admin for these details.</p>
    <label class="fld"><span>Apps Script web app URL (ends in /exec)</span><input name="api" value="${esc(cfg.api)}" placeholder="https://script.google.com/macros/s/…/exec" required></label>
    <label class="fld"><span>Kiosk key (leave blank if none)</span><input name="key" value="${esc(cfg.key)}" autocomplete="off"></label>
    <button class="btn primary block lg">Connect</button><div class="fb err" id="cmsg">${esc(msg || '')}</div></form>`;
  $('#cf').onsubmit = e => {
    e.preventDefault(); const f = e.target;
    const api = f.api.value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(api)) { $('#cmsg').textContent = 'That doesn’t look like an Apps Script web app URL.'; return; }
    try { localStorage.setItem('ilab-cfg', JSON.stringify({ api, key: f.key.value.trim() })); } catch { }
    location.hash = ''; location.reload();
  };
}
(async () => {
  const cfg = getCfg();
  if (!cfg.api || location.hash === '#setup') return showSetup(cfg);
  window.ILAB_API = cfg.api; window.ILAB_KEY = cfg.key;
  $('#brand').innerHTML = brandHTML();
  try {
    const b = await call('kioskBoot');
    BOOT.logo = b.logo || '';
    S.settings = Object.assign({}, DEFAULT_SETTINGS, b.settings || {});
    document.title = (S.settings.labName || 'iLab') + ' Kiosk';
    $('#brand').innerHTML = brandHTML();
  } catch (e) {
    if (!cfg.fixed || /key/i.test(errMsg(e))) return showSetup(cfg, errMsg(e));
    APP().innerHTML = `<div class="empty">${esc(errMsg(e))}</div>`; return;
  }
  load();
})();
</script>
